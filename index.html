<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDITion — 지도</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 지도 판. 위아래 여백은 나중에 다른 UI 가 들어갈 자리다. -->
  <div class="stage" id="stage">
    <div class="dotfield" id="dotfield"></div>
  </div>

  <script>
  /* ============================================
     지도
     글자 한 칸 = 점 하나.
     .  기본   r 붉은색   R 빛나는 붉은색   g 민트   y 노랑   b 갈색
     행의 길이는 모두 같아야 한다.
     ============================================ */
  var MAP = [
    '.................................',
    '.................................',
    '....................r..g.........',
    '..................rrrRrrgg.......',
    '................rrrrRrrrrgg......',
    '...............rrrRrrrrrrrgg.....',
    '...............rrrrrrrRrrrr..g...',
    '...............rRrrrrrrrrr......g',
    '...............rrr.rrrrrRr.......',
    '..............rr.........g.......',
    '.............rRr.....bb...ggg....',
    '...............rr....bbbb.gggg...',
    '...............rRr...bbb.gggg....',
    '.............Rrrrr...bbb.ggg.....',
    '..y............rrR...bbbb.g......',
    '..yyyyy..............bbb.........',
    '.yyyyyyy............bbbb.........',
    '....yy...........................'
  ];

  var COLOR = { r:'red', R:'glow', g:'mint', y:'yellow', b:'brown' };

  /* ============================================
     라벨
     [열, 행, 표기, 고정여부]
     열·행은 소수점 가능 (칸 사이에도 놓을 수 있다)
     네 번째 값이 1이면 항상 보이는 거점,
     비어 있으면 커서가 다가와야 드러난다.
     줄바꿈은 <br> 로 넣는다.
     ============================================ */
  var LABELS = [
    // ── 항상 보이는 거점 ──
    [18.0,  5.4, '홍대입구역', 1],
    [27.2,  5.6, '경의중앙선', 1],
    [21.5, 11.9, '홍익대<br>서울캠퍼스', 1],
    [27.0, 11.3, '와우산', 1],
    [ 2.4, 14.8, '합정역', 1],

    // ── 홍대입구역 일대 ──
    [20.0,  3.0, '올리브영'],
    [22.2,  3.8, 'AK플라자'],
    [18.2,  4.5, '삼성스토어'],
    [20.2,  4.9, '롯데시네마'],
    [16.0,  5.4, 'CGV'],
    [23.2,  5.3, '스머프매직<br>포레스트'],
    [15.2,  6.1, '메가박스'],
    [17.6,  6.1, 'ABC마트'],
    [20.2,  6.1, '니뽕내뽕'],
    [24.7,  6.3, '문하우스'],
    [17.6,  6.8, '카카오프렌즈'],
    [21.5,  6.8, '교장맥주'],
    [15.4,  7.2, 'H&M'],
    [20.0,  7.2, '와라라훠궈'],
    [26.2,  7.5, '라이브클럽 빵'],
    [17.4,  7.7, '왓에버타코'],
    [20.0,  7.7, '무한리필'],
    [22.2,  7.7, '둥지닭볶음탕'],
    [23.2,  8.4, '홍대준<br>게스트하우스'],

    // ── 상수·서교 일대 ──
    [14.4,  8.8, '레드로드'],
    [14.4,  9.3, '예술실험센터'],
    [16.8,  9.7, '케이팝스테이지'],
    [16.4, 11.0, '수림식당 홍대점'],
    [15.0, 12.1, '금복주류 홍대점'],
    [15.4, 12.9, '카페 공명'],
    [18.0, 12.9, '클럽 MODECI'],
    [14.4, 13.7, '누리마을감자탕'],

    // ── 홍익대 캠퍼스 ──
    [22.6, 10.8, '제1공학관K동'],
    [24.0, 11.3, '제2공학관P동'],
    [24.0, 12.5, '와우관L동'],
    [22.6, 14.2, '인문사회관A동'],
    [22.2, 15.7, '인문사회관D동'],

    // ── 합정 일대 ──
    [ 3.2, 10.0, '지호한방삼계탕'],
    [ 2.4, 10.8, '합정동 주민센터'],
    [ 3.6, 11.7, '홈플러스'],
    [ 1.6, 12.3, '딜라이트<br>스퀘어 2차'],
    [ 3.4, 12.9, '올리브영'],
    [ 1.6, 13.9, '토후 합정본점'],
    [ 7.4, 13.7, '조연탄 합정점'],
    [ 9.0, 14.6, '오마주'],
    [ 1.6, 15.3, '신한은행'],
    [ 7.6, 15.7, '김숙성 합정점'],
    [ 4.2, 15.8, '투썸플레이스'],
    [ 6.6, 16.6, '신협'],
    [ 2.6, 17.1, '파리바게트']
  ];

  (function () {
    var stage = document.getElementById('stage');
    var field = document.getElementById('dotfield');
    var rows = MAP.length;
    var cols = MAP[0].length;
    var dots = [];
    var labels = [];   // { el, x, y } — 근접 판정에 쓸 좌표를 함께 보관

    function build() {
      // 가로는 판을 가득 채우되, 위아래 여백은 남긴다
      var sw = stage.clientWidth;
      var sh = stage.clientHeight;
      var margin = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stage-margin')) / 100 * window.innerHeight;
      var cell = Math.min(sw / cols, (sh - margin * 2) / rows);
      document.documentElement.style.setProperty('--cell', cell + 'px');

      field.style.width  = (cols * cell) + 'px';
      field.style.height = (rows * cell) + 'px';

      // 판 한가운데 놓는다
      field.style.left = ((sw - cols * cell) / 2) + 'px';
      field.style.top  = ((sh - rows * cell) / 2) + 'px';

      var frag = document.createDocumentFragment();

      // ── 점 ──
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var key = MAP[r][c];
          var dot = document.createElement('span');

          dot.className = 'dot' + (COLOR[key] ? ' is-' + COLOR[key] : '');
          dot.dataset.col = c;
          dot.dataset.row = r;
          dot.style.left = (c * cell) + 'px';
          dot.style.top  = (r * cell) + 'px';

          // 모든 점이 저마다 다른 주기로 깜빡인다
          var duration = 1.2 + Math.random() * 4.5;
          dot.style.animationDuration = duration.toFixed(2) + 's';
          dot.style.animationDelay = (-Math.random() * duration).toFixed(2) + 's';

          frag.appendChild(dot);
        }
      }

      // ── 라벨 ──
      labels = [];
      for (var i = 0; i < LABELS.length; i++) {
        var L = LABELS[i];
        var el = document.createElement('span');

        el.className = 'label' + (L[3] ? ' label--fixed' : ' label--hover');
        el.innerHTML = L[2];

        var x = (L[0] + 0.5) * cell;
        var y = (L[1] + 0.5) * cell;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';

        frag.appendChild(el);
        labels.push({ el: el, x: x, y: y });
      }

      field.innerHTML = '';
      field.appendChild(frag);
      dots = field.querySelectorAll('.dot');
    }

    var timer;
    window.addEventListener('resize', function () {
      clearTimeout(timer);
      timer = setTimeout(build, 150);
    });

    build();

    /* ============================================
       커서 근접 반응
       DOT_RADIUS   : 점이 커지는 범위 (칸 단위)
       LABEL_RADIUS : 라벨이 드러나는 범위 (칸 단위)
       ============================================ */
    var DOT_RADIUS = 2.2;
    var LABEL_RADIUS = 3.0;

    /* ============================================
       확대 / 축소
       판 위에서 스크롤하면 커서를 기준으로 배율이 바뀐다.
       MIN_SCALE, MAX_SCALE 로 범위를 정한다.
       ============================================ */
    var scale = 1, tx = 0, ty = 0;
    var MIN_SCALE = 1, MAX_SCALE = 6;   // 원래 크기보다 작아지지 않는다

    function applyTransform() {
      field.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    }

    /* ============================================
       패닝
       판을 끌어 지도를 옮긴다.
       ============================================ */
    var dragging = false, sx = 0, sy = 0;

    stage.addEventListener('mousedown', function (e) {
      dragging = true;
      sx = e.clientX - tx;
      sy = e.clientY - ty;
      stage.classList.add('is-panning');
      e.preventDefault();
    });

    window.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      tx = e.clientX - sx;
      ty = e.clientY - sy;
      applyTransform();
    });

    window.addEventListener('mouseup', function () {
      dragging = false;
      stage.classList.remove('is-panning');
    });

    stage.addEventListener('wheel', function (e) {
      e.preventDefault();

      var box = field.getBoundingClientRect();
      // 커서가 가리키는 지도상의 지점 (배율을 걷어낸 좌표)
      var px = (e.clientX - box.left) / scale;
      var py = (e.clientY - box.top) / scale;

      var next = scale * Math.pow(0.9992, e.deltaY);
      next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));

      // 그 지점이 커서 아래 그대로 머물도록 위치를 보정한다
      tx += (e.clientX - box.left) - px * next;
      ty += (e.clientY - box.top) - py * next;

      scale = next;
      applyTransform();
    }, { passive: false });

    field.addEventListener('mousemove', function (e) {
      if (dragging) return;
      var box = field.getBoundingClientRect();
      var cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'));
      // 확대된 상태에서도 좌표가 어긋나지 않도록 배율로 나눈다
      var mx = (e.clientX - box.left) / scale;
      var my = (e.clientY - box.top) / scale;

      var dLimit = DOT_RADIUS * cell;
      var lLimit = LABEL_RADIUS * cell;

      for (var i = 0; i < dots.length; i++) {
        var d = dots[i];
        var dx = (d.dataset.col * 1 + 0.5) * cell - mx;
        var dy = (d.dataset.row * 1 + 0.5) * cell - my;
        var near = (dx * dx + dy * dy) < (dLimit * dLimit);
        if (near !== d.classList.contains('is-near')) {
          d.classList.toggle('is-near', near);
        }
      }

      for (var j = 0; j < labels.length; j++) {
        var L = labels[j];
        var lx = L.x - mx;
        var ly = L.y - my;
        var shown = (lx * lx + ly * ly) < (lLimit * lLimit);
        if (shown !== L.el.classList.contains('is-shown')) {
          L.el.classList.toggle('is-shown', shown);
        }
      }
    });

    // 판을 벗어나면 모두 원래대로
    field.addEventListener('mouseleave', function () {
      for (var i = 0; i < dots.length; i++) dots[i].classList.remove('is-near');
      for (var j = 0; j < labels.length; j++) labels[j].el.classList.remove('is-shown');
    });
  })();
  </script>

</body>
</html>
